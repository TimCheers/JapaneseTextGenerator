name: backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore KotobaApi.Tests/KotobaApi.Tests.csproj
      - run: dotnet build KotobaApi.Tests/KotobaApi.Tests.csproj --no-restore --nologo
      - run: dotnet test KotobaApi.Tests/KotobaApi.Tests.csproj --no-build --nologo
